etime incomes by billions of dollars.","D":"They have come to see the consequences of racial discrimination."},"answer":"A"},{"no":53,"stem":"How can Americans bridge the differences that divide them?","options":{"A":"By dealing with the thorny issues confronting them.","B":"By seizing every chance to enhance racial harmony.","C":"By continuing to pursue Martin Luther King Jr.'s cause.","D":"By striving to identify exceedingly valuable opportunities."},"answer":"C"},{"no":54,"stem":"How do most Americans view America as a nation according to a recent survey?","options":{"A":"It is compelled to address its historical social issues.","B":"It is delaying advancements toward racial equality.","C":"It has kept itself from polarization.","D":"It has become increasingly split. • 2025年 12月六级真题（第一套）• 8"},"answer":"D"},{"no":55,"stem":"What does the author suggest Americans do?","options":{"A":"Ensure the wellbeing of their children and grandchildren.","B":"Make joint efforts to tackle the nation's equity issues.","C":"Restrain their intolerance and discrimination.","D":"Restore social order for a harmonious nation."},"answer":"B"}],"exp":{"46":"根据题干信息词 are eager to pursue individual success 可将答案线索定位至第一段\n第一段第二句提到，我们在急于追求个人成功的路上，往往会失去朋友。由果推因，人们之所以会失去朋\n友，是因为在急于追求个人成功的过程中，忽视了与朋友的联系，与朋友渐行渐远，进而失去他们，D 项与\n此描述相符，故为正确答案。A、B、c 三项描述的是一种“没有朋友 \" 的状态，而文章描述的是在追求成功\n的过程中，从“有朋友 \" 到“失去朋友 \" 的动态变化，这三项与文章内容不符，故排除","47":"根据题干信息词 radical individualism 可将答案线索定位至第。段\n\n步对于追求极端个人主义，作者在第三段最后一句建议人们，必须重新审视极端个人自由所带来的危害。\nA 项 Reexamine its detrimental effects 是对原文中 reevaluate the ha 皿的同义转述，故为正确答案 B 项是作者\n所批判的社会现象，且与题干所问无关，故排除。c 项和 D 项是利用原文出现过的单词（chaos、turmo i 1、\naggressive）设置的干扰项，并不是作者的建议，故排除","48":"兮根据题干信息词 assumption ofpersonal achievement 可将答案线索定位至第五段\n毒第五段第二句提到了这—assumption（假设），并通过 that 引导的同位语从句对其进行了解释，即 that\nwinning or succeeding is a consequence of working harder than the next person（获胜或成功是比他人更努力\n的结果），D 项符合此描述，故为正确答案。A 项是对个人成就颂扬和称赞的社会行为，而非假设，故排\n除。B 项原文未提及，故排除。c 项是个人成就产生的文化背景，而非假设，故排除。","49" 查显示，美国公众长期以来高度重视热情原则，将其作为职业决策的\n首要标准。而在面临工作不稳定的人群中，这一原则更加盛行。\n热情原则的支持者们认为它极具说服力，因为他们相信，追随热情既能\n提供努力工作所需的动力，也能为他们找到实现满足感的场所。\n然而，我发现，追随热情并不一定会带来满足感，反而是助长过度工作\n的最强文化力量之一。我还发现，鼓励人们追求热情会持续造成社会不平等，\n因为并非每个人都拥有相同的经济资源来轻松地追求自己的热情。\n尽管热情原则广受欢迎，但并非人人都具备将其转化为稳定高薪工作所\n需的资源。[ 53 ] 来自富裕家庭的热情追求者更有能力等待他们热爱的工作出\n@ 重难点单词及短语\ndetermined adj. 下定决心的\ninvestigate 调查研究\ncounsel 建议，劝告\n。problematic adj. 有问题的\nsociologist”，社会学家\nstun 使震惊\n而丽呼”优先事项\ninstability 不稳定\ncompelling 砌，有说服力的\nfulfillmentn. 满足感；（希\n望等的）实现\nperpetuate 使持续\noverwork 过度工作\ninequality 不平等\nbroadly adv. 广泛地\nlntemship 实习\n六级 2025 ． 6 第一套 1 7\n现，并且在此期间无需担心学生贷款的问题。他们还能更轻松地接受无薪实\n习，以迈出职业生涯的第一步，同时由父母支付房租。此外，他们通常可以利\n用父母的社交网络帮助自己找到工作。调查显示，工人阶级和第一代大学毕业\n生在追求热情时，无论从事什么职业领域，最终都比家境更好的同龄人更可能\n从事低薪的非技术性工作。\n[ 54 ] 大学、职场和职业顾问向所有人推广“追随热情 \" 这一路径，而没有\n创造公平的竞争环境，这样就会持续造成职业追求者之间的社会经济不平等。\n从热情原则中受益的不仅是富裕的热情追求者，还有充满热情的员工的\n雇主。[ 55 ] 潜在雇主对热情的求职者表现出更大的兴趣，部分原因是他们认为\n这些求职者会努力工作而不期待加薪。他们甚至愿意牺牲高薪、工作稳定性和\nget one's fOOt in the dO or\n人行业，踏人门槛\nworking-class adj. 工人阶\n级的\n． level the playing field 仓刂造公\n平竞争的环境\nsocioeconomic ad 丿《礻土，会 ． 经\n济的\n有抱负的人\nwell-off adj. 富裕的\n。applicantn. 申请者\n． sacnfice 牺牲\n休闲时间来从事自己热爱的工作。\n0 · 答案详解 ·","51":"申根据题干信息词 advise people do 和 a decade 可将答案线索定位于第二段\n4 文章第二段提到，近十年来，作者告诉遇到的每一个人，他们也应该这样做，即作者在第一段中说的，做\n自己热爱的事情（do what 1 love）。选项 D 的意思与此相符，故为正确答案，选项内容是对 do what 1 love\n的同义转述。文中未提及评估工作吸引力的相关内容，故排除选项 A。选项 B 是对第三段内容的曲解，作\n者没有建议遵循被广泛接受的职业建议。选项 c 是强干扰项，作者虽然在第二段第二句中建议“追随你的\n热情 \"，但接着说“工作的事情可以以后再考虑 \"，所以作者并不是建议人们满怀热情地追求职业，而是\n去充满热情地做自己热衷之事。","52":"根据题干信息词 author feel、passion principle 和 research 可将答案线索初步定位于第四段\n第四段明确提到：“在为我的新书做研究时，我发现这一原则的真相让我震惊（stunned）。”后文详细阐\n述了作者发现的热情原则存在的三大问题：导致过度工作、加剧社会不平等、被雇主利用。这些都属于\n“后果 \" 范畴。选项 A 准确对应原文，其中 consequences“后果 \" 概括总结了后文分析的所有负面影响。\n原文中的 s 加 nned 对应选项中的 astonished，故选项 A 为正确答案。选项 B 与作者立场完全相反，作者是在批\n判该原则。选项 c 与第三段“意识到它的问题有多大 \" 矛盾。选项 D，热情原则“广受欢迎 \" 虽是事实，\n但原文并未提到作者对此的感受。","53":"根据题干信息词 turning one ' s passion into a stable, good-paying job 可将答案线索定位于倒数第三段。\n÷ 倒数第三段通过对比说明：富裕家庭的孩子能依靠“父母支付 rity."},"answer":"D"},{"no":55,"stem":"What message does the author try to convey at the end of the passage?","options":{"A":"Governments? goal should be prosperity-driven.","B":"Governments5 goal should be people-oriented.","C":"Governments should consider citizens5 views in decision-making.","D":"Governments should set sustained productivity as their top priority."},"answer":"B"}],"exp":{"46":"根据题干信息词 successful changes 可将答案线索定位至第二段\n第二段提到，成功的变革不仅需要愿景，还需要一支不仅不抵制变革，而且会拥抱变革的员工队伍，换言\n之，组织中的成功变革需要员工的热情支持，故 c 项为正确答案。该段第一句提到，大多数组织的变革计\n划几乎无法实施，A 项与原文内容相悖，故排除。文中虽然提到了 vision，但指的是变革的“愿景 \"，而\n非领导者的“远见 \"，故 B 项可排除。原文只是说模拟是一种学习工具，有助于推动变革，并未提及成功\n变革通常源于模拟学习体验，D 项过度推断，故排除。","47":"4 根据题干信息词 learning leaders 和 learners ' passion 可将答案线索定位至第段\n毒第三段第三句提到，为了激发这种广泛的热情，学习型领导者必须让员工看到变革可能带来的图景，也就\n是让他们看到变革可能实现的成果，A 项与原文表述相符，且该选项中的 what be 与原文中的\nwhat could be 相对应，故为正确答案。其他三项“摆脱旧有范式 \"“重新思考思维模式 \"“拥抱新机遇”均\n属于“看到变革图景 \" 后的结果，都是员工在受到激励后自身发生的行为变化，而非学习型领导者应采取\n的行动，故均排除","48":"根据题干信息词 lectures，training programs and workshops 可将答案线索定位至第五段\n第五段第二句提到，讲座、培训项目和研讨会能够阐释变革的知识要素，但很少能有效触及重大变革举\n措核心的行为层面。由此可知，这三种活动只能让员工学到理论知识，通常无法改变员工在工作中的行\n为，故 A 项为正确答案，同时据此排除 c 项。该段最后一句提到，像模拟这样的干预措施能够为变革提\n供动力，但并未提及以上三种活动也能为变革提供动力，故 B 项排除。原文提到，管理者很少能看到员\n工发展举措的全面成效，这说明以上三种活动并未帮助管理者实现员工发展努力的全面效果，D 项与原\n文内容相悖，故可排除。","49":"根据题干信息词 one of the mo st fruitful forms oflearning 可将答案线索定位至第六段，it 和最后一句中\n的 productive 为同义词，都可表示“富有成效的 \"\n析第六段最后一句话明确提到，在无限制、无风险的模型中探索、实验以及反复应用新知识的能力，使模拟\n成为最有成效的学习形式之一。D 项符合原文表述，故正确。A 项和 B 项虽然也是模拟的优点，但不是其\n核心优势，不足以支撑它成为最有成效的学习形式之一，故这两项排除。模拟能为员工提供沉浸式学习体\n验，但这种体验是在模拟现实情境中进行的，并非现实生活中真正的实际学习体验，故 c 项排除。","50":"根据题干信息词 reap the greatest benefits possible 可将答案线索定位至最后一段\n最后一段最后一句话提到，为了使模拟带来的益处最大化，参与者应该立即将模拟体验中所学到的知\n识应用起来，以便在学习和实践之间建立起顺畅的衔接。由此可知，为了在模拟中获得最大收益，参\n与者应该立即将他们所学到的知识应用到工作中，故 B 项正确。文中明确反对将模拟体验当作游戏，\n因为这很难将其应用到实际工作中，A 项与原文内容相悖，故排除。培养深层次理解能力是模拟带来\n的益处，而非参与者为获得最大的收益应采取的行动，c 项答非所问，故可排除。D 项内容原文并未提\n及，故排除。\nPassage TWO\n． · 概览 ·\n这篇文章批判了以 GDP 增长为核心的发展模式，通过分析“真实财富 \" 理念和心理健康问题，揭示\n了当前政策导向的局限性，指出可持续经济只是手段而非目标，主张政府应当以提升公民幸福为根本宗\n旨。作者强调，真正的进步需要政府将公民福祉而非经济产出作为终极目标，这一转变要求重构社会价\n值体系和政策优先顺序。\n六级 2025 ． 6、第三 49\n0 · 全文翻译。\n[ 51 ] GDP 增长并不能很好地衡量国家的发展水平，也不应成为政府的\n主要目标。无限增长是不可持续的，经济理念正转向我们应当追求经济模\n式的可持续性。但是，尽管可持续经济对人类的未来至关重要，它也只是\n实现目标的手段，而非目标本身。\n[ 52 ] 政府应关注国民幸福的观点受到了一些人的批评。人们担心的是如\n何衡量幸福。幸福难道不是转瞬即逝的主观心理状态吗？不同个体的幸福水\n平体验难道不是千差万别吗？即便将“幸福 \" 最广义地理解为繁荣或“生活\n满意度 \"，人们的追求也各不相同。\n当然，政府无法将生活满意度强加给民众。但我们的幸福依赖于社会协\n作。政府的责任在于创造促进繁荣的条件。有充分理由相信这些条件客观存\n在、全球适用，并可通过研究发掘。\n哲学家朱利安。巴吉尼在近期发表的文章中提出，我们应关注民众的\n“真实财富 \"，而这不依赖于 GDP 增长。[ 53 ] 关键在于可获得性：人们无需\n占有，只需获取能改善生活的资源。技术进步和社会行为变革使我们能更\n高效地利用现有资产。关注人们改善生活所需的资源获取途径将有助于减\n少不平等现象\n就目前而言，这一主张与“幸福 \" 倡导者提出的方案颇有共通之处。但\n它为政府能够且应当为民众做什么设定的标准过低。\n例如，“真实财富 \" 经济如何解决困扰我们社会的心理健康危机尚不明\n确。至少在西方国家，心理不健康对福祉的损害甚于贫困。除了大力改善心\n理健康治疗服务外，政府能够且应当采取预防性措施来提升国民心理健康水\n平。世界卫生组织建议建立促进社区参与的机构一一开展教育项目和实施干\n预措施，以传授促进心理健康所需的技能。[ 54 ] 然而，世界卫生组织不得不\n通过强调改善心理健康的经济效益来说服各国政府其建议措施的投人物有所\n值一一一这一事实本身就说明了很多问题。只要经济仍是政府的首要关注点，\n他们就只需确保民众保持持续的生产力，无需更进一步。\n[ 55 ] 要求政府将民众幸福作为最高优先级，实质是要求政府将民众本身\n@ 重难点单词及短语\nindlcator 指标\ngoal 主要目标\n． unlimlted 无限增长\n． sustamable adj. 可持续的\nmeans to an end 达到目的的\n手段\n． fleeting adj. 转瞬即逝的\nsubjective 口主观的\nprosperity”． 繁荣\n． 强加\n。collaborative efforts 协同努力\nobligation 汛责任\nglobally applicable 全球适用的\n。”． 获取（权）\ntechnological advance 技术进步\ninequality 不平等\nbar 设定标准\n。epidemic”． 流行病\n． mental ill-health 心理不健康\nadj. 有害的\n。therapeutic adj. 治疗的\npreventative measure 预防措施\nmental wellbeing 心理，健，康\nappeal to 诉诸于\njustified adj. 合理的\nproductivity 生产力\n视为终极目标。\n0 · 答案详解 ·","51":"根据题干信息词 more recent thinking of economic growth，可将答案线索定位于文章第一段\n文章开篇明确指出，GDP 增长并非衡量国家发展水平的良好指标，也不应成为政府的主要目标，并提出经\n济理念正转向追求经济模式的可持续性。选项 A 是文章的核心观点一一一从追求增长转向追求可持续性，故\n为正确答案。选项 B 是可持续经济的特点，但非最新观点；选项 c 与文中“不应成为政府的主要目标 \" 相\n矛盾；文中明确否定了选项 D 这一传统观点，故排除这三项。","52":"根据题干信息词 opposed 和 governments should focus on happiness，可将答案线索定位于文章第二段，题\n干中的 opposed 对应第二段第一句中的 criticso\n文章第二段列出了反对理由：\n、幸福难道不是转瞬即逝的主观心理状态吗？二、不同个体的幸福水平\n体验难道不是千差万别吗？一、即便将“幸福 \" 最广义地理解为繁荣或“生活满意度 \"，人们的追求也各\n不相同。这三点都说明选项 c“幸福对不同人群意义不同 \"，该项准确概括了反对者质疑的原因，即幸福\n的主观性和个体差异性使其难以成为政策目标，故为正确答案。文中虽提及政府无法将幸福强加于民众，\n但这不是反对的主要理由，故排除选项 A 原文未提及幸福是否建立在个人努力之上，故排除选项 B。选\n项 D 也不是文章列出的反对理由，故排除","53":"4 根据题干信息词 Julian Baggini suggest governments，可将答案线索定位于文章第四段\n，第四段阐述了巴吉尼的观点，即应关注公民的“真实财富 \"，关键在于可获得性：人们无需占有，只需\n获取能改善生活的资源。关注人们改善生活所需的资源获取途径将有助于减少不平等现象。选项 B“为民\n众提供改善生活的资源获取途径 \" 与巴吉尼的建议相符，故为正确答案。选项 A 是附带效果而非建议的内\n容；选项 c，文中提到的“改变行为 \" 指社会行为自然变革，非政府干预重点；选项 D“利用技术 \" 是手\n段而非政府直接行动建议，故排除这三项。","54":"根据题干信息词 WHO 和 economic benefits，可将答案线索定位于文章第六段最后两句。\n\n第六段最后两句指出，世界卫生组织不得不通过强调改善心理健康的经济效益来说服各国政府其建议措施\n的投人物有所值一一这一事实本身就说明了很多问题。只要经济仍是政府的首要关注点，他们就只需确保\n民众保持持续的生产力，无需更进一步。选项 D“政府仍以经济发展为优先关注点 \" 与此相符，故为正确\n答案。选项 A 与文中批判 GDP 的观点相悖；选项 B 虽是事实，但非题目所问原因；选项 c，文中未提及对国\n家经济体系的损害，故排除这项。","55":"根据题干信息词 the end of passage，可将答案线索定位于文章最后一段\n文章结尾的表述具有高度概括性：要求政府将民众幸福作为最高优先级，实质是要求政府将民众本身视为\n终极目标。这句话包含两个关键点：将民众幸福作为最高优先级；将民众视为终极目标。选项 B“政府目\n标应以人为本 \" 与此相符，故为正确答案。选项 A 是作者批判的传统模式，故排除。选项 c 虽然也符合事\n实，但不是作者在文末讲的内容。选项 D 正是作者反对的经济发展优先思维。\nPart IV\n0 · 难词译注 ·\n自、． 占以来 since anc ient time s\n分布 distribution\n决 address\n实施 implement\nTranslation\n宏大 grand\n水利工程 water conservancy project\n跨区域 across regions\n规划 planning\n六级 2025 ． 6 第三套 51\n线路 route\n极大地 signi ficantly\n0 · 参考译文 ．\n生后圳；境 ecological environment\n可持续 sustainable\nSince ancient times, China has faced an uneven distribution Of w ater resources，with th e north being water-\nscarce and the south water-abundant. TO effectively addre s s the critical water shortage in th e northern regions, the\nChinese government implemented the South-to-North Water Diversion Project. This is a grand water conservancy\nproject for allocating water resources across reglons. After decades Of planning and preparation, construction on the\nproject began in 2002 and is divided into three routes：East, Central, and West, with a total length of 4 350 kilometers，\nbenefiting a population of over 400 million. Since it s operational launch in 2014，the project has tran s ferred more\nthan 50 billion cubic meters of water to the north, p antly","C":"intrinsically","D":"irony","E":"layman","F":"literally","G":"majestic","H":"malicious","I":"meadow","J":"mingle","K":"predator","L":"rage","M":"scrape","N":"shrewd","O":"thrifty"},"answers":{"26":"O","27":"B","28":"A","29":"J","30":"L","31":"D","32":"E","33":"K","34":"N","35":"M"}},"matching":{"paras":15,"letters":"ABCDEFGHIJKLMNO","statements":[{"no":36,"text":"According to a senior researcher, we will have secure food supply if we rid ourselves of ignorance about native crops.","answer":"F"},{"no":37,"text":"Most of the world's food supply comes from a tiny number out of thousands of crops that have been grown for centuries.","answer":"C"},{"no":38,"text":"To provide their family with food when the staple crops failed, some African women farmers grew local crops in their backyards.","answer":"G"},{"no":39,"text":"High-yielding crops have occupied a dominant position in modern agriculture since the green revolution in the last century.","answer":"J"},{"no":40,"text":"Growing alternative crops proved feasible in a variety of environments, but the critical question was whether they would be marketable.","answer":"H"},{"no":41,"text":"According to a professor, when the yields of staple crops fall, we will have to adapt to eating foods from alternative crops.","answer":"O"},{"no":42,"text":"Urgent measures have to be taken to provide food for the projected world population without aggravating the climate.","answer":"D"},{"no":43,"text":"Colonial rule marginalised local crops by punishing Africans who grew them.","answer":"I"},{"no":44,"text":"As existing crops are endangered by global warming, we can increase food security by bringing back the many forgotten food crops.","answer":"E"},{"no":45,"text":"Researchers are trying to find out how higher temperatures and CO2 levels affect the nutritional composition of alternative crops.","answer":"K"}]},"careful":[{"no":46,"stem":"The alien finds the audience in the movie theatre clearly in a state o f .","options 中寻求快\n乐，故答案为 B)O\n〖 避错 〗 第十一段中提到了恐怖能够让我们与负面\n情绪共处，并发展出应对负面情绪的策略，但 A）\n“他们从克服现实生活中的恐惧中获得经验”并非\n人类寻求恐怖娱乐的原因，故排除；第九段指出孩\n子们能够通过捉迷藏学会如何避免成为猎物，并\n没有提到他们感受到了刺激，故排除 C)；第八段\n作者指出人们愿意在安全的环境中去感受负面情\n绪，并从中寻找乐趣，而非在真正遇到生命威胁的\n情况下，故排除 D)。","48":"〖 定位 〗 由题干中的 hide-and-seek 定位到第九段。\nA) 〖 精析 〗 细节辨认题。文章第八段第三句开始以儿\n童游戏中的捉迷藏为例支撑自己的观点。而第九\n段开头提到了 gives the child crucial information，\n即为孩子们提供了重要信息，可知本句讲述孩子们\n能够从捉迷藏游戏中学到的知识，即 how to avoid\nbecoming prey“如何避免成为猎物 \"，故答案为 A)。\n〖 避错 〗 第八段提到了捉迷藏是对捕食者和猎物互\n动的一种模拟，但这并非孩子们从中学到的东西，\n故排除 B)；第九段后半部分提到，孩子们喜欢玩\n捉迷藏类似的活动是因为这类游戏给了他们一种\n安全地体验潜在灾难性场景的经历，与 c）选项所\n述“避免犯下灾难性错误”以及 D）选项所述“把危\n险的情况变安全”不同，故排除 C)、D)O","49":"到第十一段。\n〖 精析 〗 细节归纳题。第十一段开头提到了\n0\nHorror is pleasurable to many people ． · ·”，其中\npleasurable 与题干中的 gratifying 为近义词，后面\n是 bec ause 引导的原因状语从句，说明原因：这一\n情绪让我们与负面情绪共处，并发展出应对策略。\n下一句补充说明我们体会到了真正的恐惧是什么\n感觉，也学会了如何处理自己的负面情绪，故答案\n为 C)。\n〖 避错 〗 第十二段提到了 an ancient set of\nbiological defence mechanisms\"—套古老的生物\n防御杉 L 制”、use our evolved imagination tO travel\ninto virtual worlds that are full 0f danger\" 运用进\n化来的想象力进人充满危险的虚拟世界 \"、\n\"exploiting.\n． an evolved fear system\"\" 利用进化\n的恐惧系统”和 humans are uniquely imaginative\n“人类的想象力是独一无二的”，均是为了解释恐\n怖起作用的机制，而非解释恐怖让人高兴的原因，\n故排除 A)、B)、D)。","50":"析册。2024 年 12 月六级真题（一）12\n为什么这些人类会自愿地将自己暴露在一种看起来非常不愉快的经历中？而又是为什么他们对屏幕\n上的光影产生如此强烈的反应？\n我对恐怖悖论很感兴趣，即许多人寻求恐怖娱乐这一奇怪的事实。\n我认为这个谜题的答案藏在人的本性中。\n（47）我的研究调查表明，人类在进化过程中，愿意在安全的环境中去感受负面情绪，并从中寻找乐趣。\n你能够在儿童游戏中看到这些恐怖元素。以捉迷藏为例，这是一种模拟捕食者与猎物互动的游戏。孩子\n会躲起来，而大人则假装成一个捕食者，一边寻找孩子，一边像危险的野兽一样嚎叫。\n（48）这种模拟游戏为孩子们提供了关于如何避免成为猎物的重要信息，孩子们往往会发现这种活动\n非常令人满足，大概是因为这类游戏给了他们一种安全地体验潜在灾难性场景的经历。\n他们觉得玩这个游戏很愉快，而快乐是人类进化过程中激励我们做出适应性行为的一种方式。\n（49）恐怖对许多人来说是愉快的，因为它让我们与负面情绪共处，并发展出应对负面情绪的策略。我\n们体会到了真正的恐惧是什么感觉，也学会了如何处理自己的负面情绪。\n那么，恐怖是如何起作用的呢？我的研究表明，恐怖是通过利用一套古老的生物防御机制一一一我们与\n其他动物共享的一种进化的恐惧系统一一发挥作用的。但人类的想象力是独一无二的，我们可以运用进\n化来的想象力进人充满危险的虚拟世界。\n即使你不是恐怖片的忠实粉丝，也有充分的理由看恐怖片。（50）如果你能看完这部电影且未受到伤\n害，你可能会体验到一种强烈的掌控感，一种你能熬过一段可怕经历的感觉。不管怎样，看恐怖片能让你\n更好地应对自己的恐惧，谁知道什么时候这种能力会变得至关重要呢？\nPassage TWO\n〖 文章来源 〗 本文选自 2021 年 5 月 5 日刊登在 Psychol 对农村的理想化看法，而非理想化的生活方式，\n故排除；定位段第三句谈及互联网时提到陌生文\n化被引人农村，但没有提到农村的接受情况，故排\n除 c）项；第五段第二、三句只提到工业化加剧了\n劳动分工，互联网将原本陌生的文化引人了农村，\n并没有提及农村是否多样化，故排除 D)。","50":"位到全文最后一句。\n将见证新城市从尘埃中崛起，现有城市将发展成\n为特大城市，而农村的未来仍不明朗，可见与城市\n相比，农村的未来是人们不太容易想象的，故答案\n为 D)。\n〖 避错 〗 作者在谈及未来时没有提到当地人将会如\n何，故排除 A)；B）项显然与定位句表述相悖，故排\n除；由最后一段第二句可知，整个世界的未来都是\n变化的，作者并没有比较城乡哪个更会保持静态，\n故排除。\n参考译文\n随着人口的增长和全球城市化的加速，人们更多地关注城市的可持续性，而鲜少关注农村的情况。\n乡村生活与紧密交织的社区、归属感和简单宁静的生活相联系。然而，尽管这些因素中的一些或全\n部在农村中确实存在，但保守主义和缺乏就业机会也是现实。农村社区渐趋退化的主要原因是后者。\n（46）受城市地区经济改善的吸引，世界各地的农村居民正在迁出，导致人口稠密的城市过度拥挤，而农村\n则一片荒凉。\n那么，农村如何在这些变化中确保自身存在，还是说无论有无变化都应该这样做？由于住宅和设施之\n间的距离以及间或中断的公共交通，居住在农村的人们更多地使用汽车。（47）农村居民也使用更多的能\n源来维护他们大多独立的建筑。在城市里我们可能像箱子一样堆积在一起，但这种状况所带来的能源效\n率却是农村无法比拟的。农村的能源需求导致人均碳排放量高于城市，因此支持这种生活方式的选择实\n际上是不负责任的。\n保护农村是一个热门话题。（48）那些在城里发了财的人经常在农村购置第二套房子，间歇性地去住\n住，以体验所谓的简单生活。其负面影响是，由于需求增加，房价被推高，使当地人负担不起。这一挑战的\n决方案尚未找到，因为市场力量正在进一步迫使居民离开农村。对于那些相信应该保护农村的人们而\n，这是可悲的。\n析册。2024 年 12 月六级真题（二）27\n虽然对农村的理想化看法很常见，但现实是农村生活在不断发展。工业化带来了劳动分工的增加，改\n变了农村人之间的社会联系。互联网将原本陌生的文化引人了农村。出行网点的改进和负担能力的提高\n使世界变得更加便利，创造了一个“地球村”。（49）考虑到这些变化，农村的不断发展肯定是不可避免的。\n也许农村也应该为未来的大规模人口增长做好准备。随着世界各地城市的快速发展，当下在城市生\n活的一代人将如何应对大规模城市化不可避免的社会变化？对简单生活的渴望会变得更加强烈，从而推\n动农村复兴吗？\n随着世界继续城市化，保护农村的呼声可能会越来越大。但变化是不可避免的。（50）我们知道世界\n将见证新城市从尘埃中崛起，现有城市将发展成为特大城市，而农村的未来仍不明朗。\nPassage Two\n〖 文章来源 〗 本文选自 2019 年 11 月 16 日刊登在衍@：\nand Cultural”（《品位：普遍性和文化性》）的文章。\n“记 sr e“c 朊 com 上一篇标题为“ste：Umversal\n〖 结构框图 〗\n文章主要讨论了美是个人\n的主观感受还是拥有普遍\n的客观原则。\n：第一段首先提出人们普遍认为“美存在于观看者的眼中（即美是个人的主《\n：观感受）”的观点根深蒂固，但又指出推翻这一假设或许有益。\n：第二至六段介绍了《认知》杂志上的一项探讨审美品味的研究，该研究的：\n0《结果表明了人们对自然物体和人工制品审美评价的差异，并分析了人们经《\n常对自然物体拥有共同品味，但较少对人工制品拥有共同品味的原因。\n：第七至九段阐述了作者的观点，即审美偏好或评价或许存在客观依据，美：\n0：可能有普遍客观原则，并以自然界为例进行说明，同时解释了人工制品并：\n：不总是具有普遍吸引力的原因。\n0，第十段最后强调体验不同文化及其人工制品的重要性。\n答案详解","51":"〖 定位 〗 由题干中的 beauty is in the eye 0f the\nbeholder 定位到首段第一句。\nA) 〖 精析 〗 事实细节题。文章首段第一句指出，诸如\n“美存在于观看者的眼中 \" 此类的说法，鲜少遭到\n质疑。由此可知，“美存在于观看者的眼中”这种\n说法几乎从未被质疑过，故答案为 A)。\n〖 避错 〗 首段第三句提到人们会从审美角度来评价\n环境、状况和人，而不是从审美角度诠释这种说法，\n故排除 B）项；首段第二句指出，这蚱说法在我们的\n意识里已然根深蒂固，以至于人们认为不这样想就\n很荒谬，而非许多人认为这种说 案为 A)。\n〖 避错 〗 原文中并未提到宇宙一直在以一致的方式\n进化的观点，选项 B）为无中生有，故排除；第三段\n最后一句提到了 the two halves 0f our brains\nwork together，指的是关于我们大脑的两个半球\n如何协同工作的实际科学有时比小说还要奇特，\n而不是与大脑不同区域有不同功能的想法相矛\n盾，故排除 c）项；第四段第二句中提到了在所有\n脊椎动物中，右脑半球控制身体的左侧，这是为了\n说明大脑的不同区域有不同的功能，故排除\nD) 项。","49":"位到第六段第四句和第六句。\n为我们有左脑或右脑主导者且这与性格相关的想\n法是绝对错误的。紧接着该段最后一句提到，神\n经科学家不相信，也从未相信过。由此可知，神经\n科学家长期以来拒绝相信的是存在左脑或右脑主\n导者，且他们的性格不同，故答案为 A)。\n〖 避错 〗 最后一段第一句提到了左右脑半球之间确\n实存在着重要差异，但这是指科学家们所了解到\n的，而不是他们拒绝相信的，B）与原文表述不符，\n故排除；第六段第三句指出性格与大脑不同半球\n无关，并表明这是经过证明的，也就是说这也并非\n神经科学家拒绝相信的观点，故排除 C）项；第四\n段最后一句提到科学家们早已知晓，大脑的不同\n析册 · 2024 年 12 月六级真题（三）36\n区域有不同的功能，并且第六段第一句强调神经\n科学家的研究成果揭示了大脑不同半球对不同活\n动的重要性，由此可知，神经科学家相信大脑的不\n同区域负责不同的活动，故排除 D）项。","50":"〖 定位 〗 由题干中的 do wi th an online quiz that\ntells us something a bout ourselves 定位到文章最\n后一段第五句和最后一句。\nD) 〖 精析 〗 推理判断题。最后一段第五句提到，当你\n想出一个在线测试来告诉我们一些关于自身的事\n情时，我们就会受其吸引。然后该段最后一句提\n出《建讠义 you have tO take it with an enormous\ngrain Of salt，with an e normous grain Of salt 着《1 比\n处意为“持怀疑态度”，故答案为 D)。\n〖 避错 〗 原文并未提及建议人们挑战在线测试的权\n威性、审查在线测试的独创性和评价在线测试的\n流行性，故同时排除 A)、B）和 C) 项。\n参考译文\n（46）网上有数百种性格测试，声称能够确定你的大脑是左脑还是右脑占主导地位。左脑型人被认为\n逻辑思维强，且擅长语言和数学，而右脑型人更具想象力，情商更高，空间推理能力也更强。只存在一个问\n题：这并非大脑的工作方式。\n科普爱好者在某种程度上接受了这一想法，并将其付诸实践，如今它已融人了流行文化，不会消失\n不见。\n尽管这一看法长期存在，但其实并没有“右脑型”或“左脑型”这回事。无论你是一个更倾向于创造力\n还是逻辑的人，这都与你大脑的一个半球支配另一个半球毫无关系。（47）但是，关于我们大脑的两个半球\n如何协同工作的实际科学有时比小说还要奇特。\n人脑分为两个半球，左半球和右半球。在所有脊椎动物中，右半球控制身体的左侧，反之亦然。由于\n脑损伤患者的行为，科学家们早已知晓，大脑的不同区域有不同的功能。\n（48）但许多科学家对此想法感到困惑，因为大脑左右半球运作方式不同的这一说法颠覆了自然界倾\n向于完美对称的观\n神经科学家的研究成果揭示了大脑不同半球对不同活动的重要性。然而，他们的研究很快就发现了\n公众的一些误解：有些人认为有创造力的人一定是右脑型，而有逻辑的人一定是左脑型。事实证明，不仅\n性格与大脑不同半球无关，而且人类并非一开始就是真正的右脑或左脑型。（49 · 1）那种认为我们有左脑\n或右脑主导者且这与性格相关的想法是绝对错误的。这在神经科学界从未得到过支持。（49 · 2）神经科学\n家不相信，也从未相信过。\n科学家们所了解到的是，左右脑半球之间确实存在着重要差异。只是它们与性格无关，也与认知策略\n是否更具逻辑性、自由性或创造性无关。虽然研究人员已证明大脑半球影响我们生活的方式的局限性，但\n不难理解此类想法的吸引力。人们总是对自己和朋友充满兴趣，人们对世界看法的细微差异对他们来说\n确实意义非凡。（50 一 1）当你想出一个在线测试来告诉我们一些关于自身的事情时，我们就会受其吸引。\n这是不可抗拒的。（50 一 2）但你必须对此持怀疑态度。\nPassage TWO\n〖 文章来源 〗 本文选自 2022 年 11 月 19 日刊登在 www · abc15 ． com/讹上一篇标题为“ln One Mesa\nClassr to such fields of study as the immune system."},"answer":"C"}],"exp":{"46":"根据题干信息词 sarcasm and jazz have something surprisingly in common 可将答案线索定位至第一段第一句。\n第一段第一句直接表明，讽刺和爵士乐有一个惊人的共同点：一听就懂。A 项中的 reco zed 同义替换原文\n的 know，heard 是文中原词，故本题选 A。B 项原文未提及，直接排除。c、D 两项是讽刺的特点，不是爵\n士乐的，故也排除。","47":"根据题干信息词厩 1 和 hear sarcastic comments 可将答案线索定位至第四段第一句。\n第四段第一句讲到，尽管表面上带着微笑，但很多人在收到讽刺性的评论时都会感到被轻视了，且会认为\n对方粗鲁、卑劣。B 项中的 belittled and disrespected 同义替换原文的 put down，故本题选 B。其他三项定位\n段未提及，故均排除。","48":"根据题干信息词 a person consistently acts sarcastically 可将答案线索定位至第五段第一句\n第五段第一句提及，由于行为强烈地决定着思想和情感，如果一个人总是采取讽刺的行为，可能只会加\n剧其潜在的敌意和不安全感。选项 B 中的 increasmgly 是原文 heighten 的同义转述，insecure 和 hostile 是原词复\n现，只改变了词性，故本题选 B。其他三项与定位段表述不符，均排除。","49":"根据题干信息词 quitting sarcastic comments 可将答案线索定位至第六段第一句，quit 与原文中的 stop 是同\n义词。\n第六段第一句讲到，相反，当一个人停止发表负面评论，尤其是讽刺性评论时，他们可能很快就会开始感\n到更快乐、更自信。第二句讲到，同时，他们生命中的其他人也会因此受益匪浅，因为他们再也不用听到\n这种伤感情的讽刺语言了。c 项是对该段内容的总结概括，故本题选 c。A 项与原文表述不一致，B、D 两\n项原文未提及，均排除。","50":"令根据题干信息词 di rence between a speaker' s wit and sarcasm 可将答案线索定位至最后一段第一句。\n希最后一段总结道，风趣与讽刺的主要区别在于，讽刺往往是伪装成幽默的敌意。它可能意在伤人，而且往\n往尖酸刻薄。风趣的表达则通常是对某人的无益言论或行为的回应，目的是通过强调其荒谬来理清和阐明\n问题。也就是说，讽刺的目的在于出口伤人，而风趣的表达则是为了理清所谈论的问题，出发点有着根本\n的不同。由此可知，D 项是对该段的总结概括，故本题选 D。\nPassage Two\n本文节选自 Max PIanck ln stitute F or psycholinguistics 官网于 2022 年 5 月 13 日发表的一篇标题为 \"The\nrole of variability: 什 om pl aying tenni s to learning language\" 的文章。文章探讨了在学习过程中可变性的重\n要性及对学习效果和泛化能力的影响。文章指出，理解可变性的影响对我们日常生活的每个方面都很重\n要，它不仅影响我们学习语言、运动技能和分类的方式，甚至影响我们的社交生活。\n0 全文翻译 ·\n可变性对于学习新技能至关重要。细想一下学习网球中的发球。你是否应该总\n是从球场上完全相同的位置练习发球，瞄准同一个点？尽管在更多的可变条件下练习\n一开始会更慢些，但最终可能让你成为一名更好的网球运动员。这是因为可变性有助\n于更好地泛化所学的内容。\n人们在许多领域都发现了这一原理，包括语音感知和类别学习。[ 51 ] 例如，\n如果只让婴儿接触吉娃娃，而不是许多不同种类的狗，他们将很难学会“狗”这一\n类别。\n“这个基本原理有十多个不同的名字，”利莫 ． 雷维夫说，她是最近一项研究的高\n级研究员。“从可变性较小的输人中学习通常很快，但可能无法泛化到新的刺激中。\n为了识别那些关键的模式并理解可变性效应的根本原理，雷维夫和她的同事回\n顾了各领域的巧 0 多项关于可变性和泛化的研究，包括计算机科学、语言学、分类\n学、视觉感知和正规教育。\n这些研究人员发现，在不同的研究中，“可变性”一词可以指至少四种不同类型\n的可变性，如集合大小和时间安排。[ 52 ] 雷维夫说：“这四种可变性从未被直接比较\n过一一一这意味着我们目前不知道哪一种对学习最有效。\n可变性的影响取决于它是否与任务相关。但根据 \"Mr. Miyagi 原则 \"，练习看似\n无关的技能实际上可能有利于学习其他技能。\n但为什么可变性会影响学习和泛化？一种理论认为，更多的可变输人可以突出\n任务的哪些方面是相关的，哪些不是。\n另一种理论是，更大的可变性会导致更广泛的泛化。这是因为可变性将更好地\n代表现实世界，包括非典型的例子。\n[ 53 ] 第三个原因与记忆的工作方式有关：当训练可变时，学习者被迫主动重建\n他们的记忆。\n雷维夫解释道：“理解可变性的影响对我们日常生活的每一个方面都很重要。它\n除了影响我们学习语言、运动技能和类别的方式，甚至对我们的社交生活也会有影\n响。[ 54 ] 例如，人脸识别受到人们是在小社区还是在较大社区长大的影响。童年时期\n接触到的面孔较少，和人脸记忆的减弱有关。\n[ 55 ] 雷维夫总结道：“我们希望这项工作能激发人们的好奇心，并在这个主题上\n产生更多的研究。我们的论文提出了很多开放性的问题。我们能在大脑之夕卜，例如免\n疫系统中，发现可变性的类似影响吗？”\n@ 重难点单词及短语\nvariability 可变性\n。serve 发（球）\ncourt（网球等运\n动的）球场，赛场\n。generalisation · 氵乏\n化，归纳\n。domain 领域\n范围\n。perception 涨感知；\n看法\nlnvestigator 讠周查\n人员\ninput 输人，输人\n的信息\n。stimuli 刺激，刺\n激物\nunderlying prmciple\n根本原理\nset size 集合大小\nreconstruct 重建；\n改造\n。exposure 接触\n暴露\ndiminished 砌 ． 减\n弱的\nimmune system 免丿芟\n系统\n六级 2024 ． 6 兰套 49\n注：\"Mr. Miyagi principle\" 在文章中指的是一个观点，即练习看似不相关的技能实际上可能有助于学习\n其他技能。这个概念可能借鉴了电影《龙威小子》（TheKarateKid) 中的角色 Mr. Miyagi，他经常让他的学生\nDanieI 做一些看似与空手道无关的家务活，比如擦车，但实际上这些活动都是为了培养他的平衡、协调和专注\n力，这些技能后来被证明对空手道训练是非常有帮助的。\n0《。答案详解 ·","51":"根据题干信息词 in nts learning the category“dog \" 可将答案线索定位于第二段。\n文章第二段第二句提到，如果只让婴丿 L 接触吉娃娃，而不是许多不同种类的狗，他们将很难学会“狗 \" 这\n一类另刂。原文中的 struggle to 和 A 选项中的 encounter some degree of di 冚 cul 呼表达相同含义，故选项 A 为正确\n答案。选项 B、c、D 在文中没有提到，故都排除。","52":"根据题干信息词 ur different kinds of variabili 呼可将答案线索定位于第五段。\n÷ 文章第五段首句提到了四种不同的可变性，接着引用雷维夫的话，“这四种可变性从未被直接比较过一一\n这意味着我们目前不知道哪一种对学习最有效。”选项 D 是对该句话的同义转述，故为正确答案。选项 A\n在原文中未提到，故排除。选项 B、c 是根据原文中的词语 effective learning、been directly compared 设置\n的干扰项，故都排除。","53":"根据题干信息词 one ofthe the 丽 es 和 skills 可将答案范围初步锁定在第七至九段。\n÷ 第七、八、九这三段都在解释可变性为什么会影响学习和泛化，并分别给出了三种理论。比对发现，文章\n第九段提到“第三个原因与记忆的工作方式有关：当训练可变时，学习者被迫主动重建他们的记忆 \"。原\n文中的 are forced to reconstruct their memones 与选项 B 中的 are compelled to reorganise their memories 是同义替\n换，故为正确答案。原文提到，可变性将更好地代表现实世界，包括非典型的例子，故选项 A 错误。选项\nc 提到了“忽略那些无关的方面 \"，而原文只是说“更多的可变输人可以突出任务的哪些方面是相关的，\n哪些方面不是 \"，只是对任务是否相关做了分类，并没说要忽略任务的无关方面，故也排除。选项 D 与第\n六段提到的“Mr. Miyagi 原贝刂 \" 不符，故也排除。","54":"根据题干信息词朊 e recognition 可将答案线索定位于第十段\n÷ 文章第十段提到“人脸识别受到人们是在小社区还是在较大社区长大的影响，童年时期接触到的面孔较\n少，和人脸记忆的减弱有关”。也就是说，社区的规模影响人们的人脸识别能力，人们成长的社区越大，\n50 六级 2024 ． 6\n接触的面孔越多，人脸识别能力就越强，故选项 D 正确。选项 A 和 c 是对该部分内容的错误解读，故排除。\n原文提到“理解可变性的影响对我们日常生活的每一个方面都很重要 \"，而不是人脸识别对我们生活的每\n一个方面有重要影响，故排除选项 B。","55":"根据题干信息词 Raviv hope 和 their research work 可将答案线索定位于最后一段。\n÷ 文章最后一段首句引用雷维夫的话：“我们希望这项工作能激发人们的好奇心，并在这个主题上产生更多\n的研究。”选项 c 是对该句话的同义转述，故为正确答案。选项 A、B 在原文中未提及，故排除。选项 D 是\n一个强干扰项，文章最后提出了开放性问题：是否可以在大脑之外的系统，例如免疫系统中，发现可变\n性的类似影响？这个问题只是雷维夫等研究者在论文中提出的问题之一，并不能准确概括题意，故排除选\n项 DO\n0 · 难词译注 ·\n消暑纳凉 relieve summer heat\n造型优美 elegant shape\n做工精良 fine craftsmanship\n山水 landscape\n0 · 参考译文 ·\nPart IV > TransIation\n精美图案 intricate design\n艺术价值 artistic value\n． 艺术品味 artistic taste\n真挚的情感 heartfelt emotion\n实用功能 practical utility\n大为减弱 significantly diminish\n文化符号 cultural icon\nFans have been cherished by the Chinese people since anc ient times，yet now they are no longer mere ly t001s\nfor relieving summer heat；instead, they are mcreasingly admired as works Of art · M any fans fe ature elegant shapes,\nfine craftsmanship, and are painted with intric ate designs of landscapes, flowers，birds, and 行 gure s，holding high\nartistic value. Many renowned Chinese painters and calligraphers delight in inscrib ing poems and painting picture s on\nfans, showing their artistic taste · Fans are frequently presented as gifts, conveying delightful blessings and heartfelt\nemotions · TOday, the practical utility of fans has significantly diminished，yet as a cultural icon and a form of art, they\ncontmue tO play an important role in traditional Chinese culture ．\n0 ' 译点精析 0\n1. 第一句：“深受中国人喜爱 \" 可翻译为 have been cherished by the Chinese people，也可直译为 have been deeply\nloved by the Chinese people；“但现在 · · · ·“供人欣赏 \" 和前一句构成转折关系，用 but 或 yet 连接；“已不只\n是 · · · · · · 而 · · · · · · ' ' 应翻译为 are no longer merely...but... 或者 are no longer merely...; inste ad.“，“更多地作为艺术品\n供丿、欣赏 \" 翻译为 are increasingly admired as works ofarto\n2 · 第二句：“许多扇子造型优美、做工精良 \" 表达的是扇子的特点，可使用 feature（以 · · · · · · 为特征）这一表\n达；“具有很高的艺术价值 \" 表示补充说明，可翻译成现在分词形式的伴随状语，即 holding/having high\nartistic value。\n3 · 第二句：“作诗 \" 根据语境指的是在扇面上题诗，应使用动词 inscribe，“作诗绘画 \" 是并列的动宾结构，可\n翻译成 inscribe poems and paint p i cture；“展示其艺术品味 \" 表示伴随情况，翻译成现在分词短语 showing\ntheir artistic taste。\n六级 2024 ． 6 弟三《51"},"guide":{"file":"2024.6六级第三套解析.pdf","cloze":[3,4],"matching":[5,7],"careful":[7,11]}}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("DATA").textContent);
const PAPERS = Object.keys(DATA);
const TAGS = ["词不认识","句子没读懂","定位错段","同义替换没认出","过度推断","被干扰项骗","时间不够"];
const KEY = "cet6-judge-v1";

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function rec(pid){ if(!store[pid]) store[pid]={}; return store[pid]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

let cur = PAPERS[0];

// ---------- 判定 ----------
function correctOf(pid, no){
  const p = DATA[pid];
  if (no <= 35) return p.cloze.answers[String(no)];
  if (no <= 45) { const s = p.matching.statements.find(x => x.no === no); return s ? s.answer : null; }
  const q = p.careful.find(x => x.no === no); return q ? q.answer : null;
}
function lettersFor(pid, no){
  const p = DATA[pid];
  if (no <= 35) return Object.keys(p.cloze.bank).sort();
  if (no <= 45) return p.matching.letters.split("");
  return ["A","B","C","D"];
}
function scoreOf(pid){
  const r = rec(pid); let hit = 0, done = 0;
  for (const k in r) {
    const a = r[k] && r[k].a; if (!a) continue;
    done++;
    if (a === correctOf(pid, parseInt(k))) hit++;
  }
  return { hit, done };
}

// ---------- 渲染 ----------
function renderPaperSelector(){
  const sel = document.getElementById("paper");
  sel.innerHTML = "";
  PAPERS.forEach(pid => {
    const o = document.createElement("option");
    const sc = scoreOf(pid);
    o.value = pid;
    o.textContent = pid + (sc.done ? "　" + sc.hit + "/30" : "");
    if (pid === cur) o.selected = true;
    sel.appendChild(o);
  });
}

function qBlock(pid, no, stemText, isCloze){
  const p = DATA[pid], r = rec(pid);
  const my = (r[no] && r[no].a) || "";
  const ans = correctOf(pid, no);
  const verdict = my ? (my === ans ? "hit" : "miss") : "";

  const box = document.createElement("div");
  box.className = "q " + verdict;
  box.dataset.no = no;

  const head = document.createElement("div");
  head.className = "qhead";
  const noEl = document.createElement("div");
  noEl.className = "no"; noEl.textContent = no;
  const stem = document.createElement("div");
  stem.className = "stem"; stem.textContent = stemText;
  head.appendChild(noEl); head.appendChild(stem);
  box.appendChild(head);

  if (isCloze) {
    const det = document.createElement("details");
    det.className = "clz";
    const sm = document.createElement("summary");
    sm.textContent = "词库（A–O）";
    det.appendChild(sm);
    const bl = document.createElement("div");
    bl.className = "bankline";
    bl.textContent = Object.keys(p.cloze.bank).sort().map(k => k + ") " + p.cloze.bank[k]).join("　");
    det.appendChild(bl);
    box.appendChild(det);
  }

  const opts = document.createElement("div");
  opts.className = "opts";
  lettersFor(pid, no).forEach(L => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = L;
    if (my === L) b.classList.add(L === ans ? "right" : "wrong");
    if (my && L === ans) b.classList.add("ans");
    b.onclick = () => {
      const rr = rec(pid);
      rr[no] = rr[no] || {};
      rr[no].a = (rr[no].a === L) ? "" : L;
      save();
      render();
    };
    opts.appendChild(b);
  });
  box.appendChild(opts);

  const mark = document.createElement("div");
  mark.className = "mark";
  if (my) {
    const lab = document.createElement("span");
    lab.className = "lab";
    lab.textContent = my === ans ? "正确" : "错，正确答案 " + ans + "　错因：";
    mark.appendChild(lab);
  }
  if (my && my !== ans) {
    const curTag = (r[no] && r[no].t) || "";
    TAGS.forEach(t => {
      const b = document.createElement("button");
      b.className = "tag" + (curTag === t ? " on" : "");
      b.textContent = t;
      b.onclick = () => {
        const rr = rec(pid); rr[no] = rr[no] || {};
        rr[no].t = (rr[no].t === t) ? "" : t;
        save(); render();
      };
      mark.appendChild(b);
    });
  }
  box.appendChild(mark);

  // 解析正文（OCR）：错题默认展开，答对折叠
  const ex = (p.exp && p.exp[String(no)]) || "";
  if (ex) {
    const det = document.createElement("details");
    det.className = "exp";
    if (verdict === "miss") det.open = true;
    const sm = document.createElement("summary");
    sm.textContent = "解析";
    det.appendChild(sm);
    const tx = document.createElement("div");
    tx.className = "exptext";
    tx.textContent = ex;
    det.appendChild(tx);
    box.appendChild(det);
  } else {
    // 没有解析正文时，退回到页码导航
    const gtype = no <= 35 ? "cloze" : no <= 45 ? "matching" : "careful";
    const g = p.guide;
    if (g && g[gtype]) {
      const gd = document.createElement("div");
      gd.className = "guide";
      const rg = g[gtype];
      gd.textContent = "解析：题目及解析汇总/" + g.file + "　第 " + (rg[0] === rg[1] ? rg[0] : rg[0] + "–" + rg[1]) + " 页";
      box.appendChild(gd);
    }
  }
  return box;
}

function render(){
  const p = DATA[cur];
  const host = document.getElementById("do");
  host.innerHTML = "";

  const g1 = document.createElement("div"); g1.className = "grp";
  g1.innerHTML = '<h2>选词填空 <span>26–35　答案 A–O</span></h2>';
  for (let n = 26; n <= 35; n++) g1.appendChild(qBlock(cur, n, "（第 " + n + " 空）", true));
  host.appendChild(g1);

  const g2 = document.createElement("div"); g2.className = "grp";
  g2.innerHTML = '<h2>长篇阅读 段落匹配 <span>36–45　答案 ' + p.matching.letters[0] + "–" + p.matching.letters.slice(-1) + "</span></h2>";
  p.matching.statements.forEach(s => g2.appendChild(qBlock(cur, s.no, s.text || "（陈述 " + s.no + "）", false)));
  host.appendChild(g2);

  const g3 = document.createElement("div"); g3.className = "grp";
  g3.innerHTML = '<h2>仔细阅读 <span>46–55　答案 A–D</span></h2>';
  p.careful.forEach(q => g3.appendChild(qBlock(cur, q.no, q.stem, false)));
  host.appendChild(g3);

  const sc = scoreOf(cur);
  document.getElementById("done").textContent = sc.done;
  document.getElementById("score").textContent = sc.hit;
  document.getElementById("rate").textContent = sc.done ? Math.round(sc.hit * 100 / sc.done) + "%" : "—";
  renderPaperSelector();
}

// ---------- 统计 ----------
function renderStats(){
  const host = document.getElementById("stats");
  let total = 0, hit = 0, done = 0;
  const byType = { "选词填空": [0,0], "长篇匹配": [0,0], "仔细阅读": [0,0] };
  const tagCount = {};
  const rows = [];

  PAPERS.forEach(pid => {
    const r = rec(pid); let d = 0, h = 0;
    for (const k in r) {
      const o = r[k]; if (!o || !o.a) continue;
      const no = parseInt(k), ans = correctOf(pid, no);
      const t = no <= 35 ? "选词填空" : no <= 45 ? "长篇匹配" : "仔细阅读";
      byType[t][0]++; d++;
      if (o.a === ans) { h++; hit++; byType[t][1]++; }
      else if (o.t) tagCount[o.t] = (tagCount[o.t] || 0) + 1;
    }
    total += 30; done += d;
    if (d) rows.push([pid, h, d]);
  });

  let html = '<div class="card"><h3>总览</h3><div class="flex">' +
    '<div><div class="big">' + (done ? Math.round(hit * 100 / done) + "%" : "—") + '</div><div class="muted">总正确率</div></div>' +
    '<div><div class="big">' + hit + " / " + done + '</div><div class="muted">答对 / 已答</div></div>' +
    '<div><div class="big">' + (total - done) + '</div><div class="muted">未答</div></div>' +
    '</div></div>';

  html += '<div class="card"><h3>分题型正确率</h3>';
  Object.keys(byType).forEach(t => {
    const [d2, h2] = byType[t];
    const pct = d2 ? Math.round(h2 * 100 / d2) : 0;
    html += '<div class="row"><div class="top"><span>' + t + '</span><span>' + h2 + '/' + d2 + '　' + (d2 ? pct + "%" : "—") + '</span></div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  });
  html += '</div>';

  const maxTag = Math.max(1, ...Object.values(tagCount));
  html += '<div class="card"><h3>错因分布</h3>';
  const anyTag = Object.keys(tagCount).length > 0;
  if (!anyTag) html += '<div class="muted">还没有标记错因。做错的题在「做题」页点一下标签即可。</div>';
  TAGS.forEach(t => {
    const c = tagCount[t] || 0;
    html += '<div class="row"><div class="top"><span>' + t + '</span><span>' + c + ' 题</span></div>' +
            '<div class="bar"><i style="width:' + Math.round(c * 100 / maxTag) + '%"></i></div></div>';
  });
  html += '</div>';

  if (rows.length) {
    html += '<div class="card"><h3>各套进度</h3><table><tr><th>套次</th><th>答对</th><th>已答</th><th>正确率</th></tr>';
    rows.forEach(([pid, h, d]) => {
      html += '<tr><td class="k">' + pid + '</td><td>' + h + '</td><td>' + d + '</td><td>' + Math.round(h * 100 / d) + '%</td></tr>';
    });
    html += '</table></div>';
  }

  host.innerHTML = html;
}

// ---------- 交互 ----------
document.getElementById("paper").onchange = e => { cur = e.target.value; render(); };
document.getElementById("tabDo").onclick = () => {
  document.getElementById("do").style.display = "block";
  document.getElementById("stats").style.display = "none";
  document.getElementById("tabDo").classList.add("on");
  document.getElementById("tabStats").classList.remove("on");
  render();
};
document.getElementById("tabStats").onclick = () => {
  document.getElementById("do").style.display = "none";
  document.getElementById("stats").style.display = "block";
  document.getElementById("tabStats").classList.add("on");
  document.getElementById("tabDo").classList.remove("on");
  renderStats();
};
document.getElementById("btnCsv").onclick = () => {
  const lines = ["paper,题号,我的答案,正确答案,对错,错因"];
  PAPERS.forEach(pid => {
    const r = rec(pid);
    for (let n = 26; n <= 55; n++) {
      const o = r[n]; if (!o || !o.a) continue;
      const ans = correctOf(pid, n);
      lines.push([pid, n, o.a, ans, o.a === ans ? "对" : "错", o.t || ""].join(","));
    }
  });
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "六级做题记录.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

render();
</script>
</body>
</html>
